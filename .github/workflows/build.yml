name: Build and Release

on:
  push:
    tags:
      - 'v*' # Se déclenche lorsque vous poussez un tag de version (ex: v1.0.0)
  workflow_dispatch: # Permet de lancer le build manuellement depuis GitHub

jobs:
  release:
    name: Build and Release AudioSplitter
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler et empaqueter l'application
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier sur les Releases GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
